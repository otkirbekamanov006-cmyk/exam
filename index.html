<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yo'qotilgan buyum</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7280;--pr:#2563eb;--bd:#e5e7eb;--ok:#16a34a;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#192032;--tx:#e8ecf4;--mu:#97a0b3;--bd:#2a3350}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0;flex:1;cursor:pointer}
main{max-width:980px;margin:20px auto;padding:0 16px}
button,.btn{background:var(--pr);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px}
button.gh{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.rd{background:var(--er)}button.gr{background:var(--ok)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);margin:4px 0 10px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.card .b{padding:12px}.card img{width:100%;height:140px;object-fit:cover;background:var(--bd);display:block}
.delete-button{display:block;width:100%;margin-top:10px;background:var(--er);font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;background:var(--pr)}.tag.found{background:var(--ok)}.tag.lost{background:var(--er)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;max-width:460px;margin:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row>*{flex:1;min-width:120px}
.mu{color:var(--mu);font-size:13px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none}
#nav{margin:0}
.detail-image{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
@media(max-width:600px){
  body{overflow-x:hidden}
  header{padding:10px 14px;gap:8px}
  header h1{width:100%;font-size:19px}
  #nav{width:100%;flex:none;gap:6px}
  #nav>*{min-width:0;min-height:42px}
  #nav .mu{flex:1 0 100%;min-height:0}
  main{width:100%;margin:14px auto;padding:0 12px}
  .row>*{min-width:0}
  .filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filter-row #q,.filter-row button{grid-column:1/-1}
  .filter-row input,.filter-row select,.filter-row button{margin:0;min-height:44px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr));gap:10px}
  .card img{height:auto;aspect-ratio:4/3;object-fit:cover}
  .box{width:100%;max-width:100%;padding:15px;border-radius:10px}
  button,.btn{min-height:42px;padding:10px 12px}
  .delete-button{min-height:48px;margin-top:12px}
  input,select,textarea{min-height:44px}
  .detail-image{max-height:65vh;object-fit:contain}
}
</style>
</head>
<body>
<header><h1 onclick="go('home')">🔎 Yo'qotilgan buyum</h1><nav id="nav" class="row" style="margin:0;flex:none"></nav></header>
<main id="app"></main><div id="toast"></div>
<script>
const API='/api';let me=null,token=localStorage.getItem('t')||'',cats=[];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
async function api(p,o={}){
  const h={...(token?{Authorization:'Bearer '+token}:{})};
  if(o.body&&!(o.body instanceof FormData)){h['Content-Type']='application/json';o.body=JSON.stringify(o.body)}
  const r=await fetch(API+p,{...o,headers:h});let j={};try{j=await r.json()}catch{}
  if(!r.ok){const e=j.errors?.map(x=>x.message).join(', ')||j.message||'Xatolik';throw new Error(e)}
  return j}
const run=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message)}};
async function init(){
  try{cats=(await api('/categories')).data||[]}catch{}
  if(token){try{me=(await api('/auth/me')).data}catch{token='';localStorage.removeItem('t')}}
  nav();go('home')}
function nav(){
  $('#nav').innerHTML=me?`<span class="mu">${esc(me.full_name)} · ${me.role}</span>
  <button class="gh" onclick="go('add')">+ E'lon</button><button class="gh" onclick="go('my')">E'lonlarim</button>
  <button class="gh" onclick="go('claims')">Da'volarim</button>${me.role==='admin'?'<button class="gh" onclick="go(\'admin\')">Admin</button>':''}
  <button onclick="logout()">Chiqish</button>`:`<button class="gh" onclick="go('login')">Kirish</button><button onclick="go('reg')">Ro'yxatdan o'tish</button>`}
function logout(){token='';me=null;localStorage.removeItem('t');nav();go('home')}
const views={
home:run(async()=>{
  app.innerHTML=`<div class="row filter-row"><input id="q" placeholder="Qidirish..."><select id="ty"><option value="">Hammasi</option><option value="lost">Yo'qotilgan</option><option value="found">Topilgan</option></select>
  <select id="ct"><option value="">Kategoriya</option>${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button onclick="load()">Qidirish</button></div><div id="list" class="grid"></div>`;load()}),
login:()=>{app.innerHTML=`<div class="box"><h2>Kirish</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Parol">
  <button onclick="doLogin()">Kirish</button> <button class="gh" onclick="go('forgot')">Parolni unutdim</button>
  <button class="gh" onclick="go('verify',$('#e').value)">Emailni tasdiqlash</button></div>`},
reg:()=>{app.innerHTML=`<div class="box"><h2>Ro'yxatdan o'tish</h2><input id="n" placeholder="Ism familiya"><input id="e" placeholder="Email">
  <input id="ph" placeholder="+998901234567"><input id="p" type="password" placeholder="Parol (8+, harf va raqam)"><button onclick="doReg()">Yuborish</button></div>`},
verify:(email='')=>{app.innerHTML=`<div class="box"><h2>Emailni tasdiqlash</h2><input id="e" value="${esc(email)}" placeholder="Email"><input id="c" placeholder="6 xonali kod">
  <p id="verify-hint" class="mu"></p><button onclick="doVerify()">Tasdiqlash</button> <button class="gh" onclick="resendCode()">Kodni qayta yuborish</button></div>`},
forgot:()=>{app.innerHTML=`<div class="box"><h2>Parolni tiklash</h2><input id="e" placeholder="Email"><button onclick="doForgot()">Kod yuborish</button>
  <p id="reset-hint" class="mu"></p><hr><input id="c" placeholder="Kod"><input id="p" type="password" placeholder="Yangi parol"><button onclick="doReset()">Saqlash</button></div>`},
add:()=>{if(!me)return go('login');app.innerHTML=`<div class="box"><h2>Yangi e'lon</h2>
  <select id="t" onchange="$('#sec').style.display=this.value==='found'?'block':'none'"><option value="lost">Yo'qotdim</option><option value="found">Topdim</option></select>
  <input id="ti" placeholder="Sarlavha"><textarea id="d" placeholder="Tavsif (10+ belgi)"></textarea><input id="l" placeholder="Joy">
  <input id="dt" type="date"><select id="c">${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
  <div id="sec" style="display:none"><input id="sq" placeholder="Maxfiy savol (10+ belgi)"><input id="sa" placeholder="Maxfiy javob"></div>
  <input id="im" type="file" accept="image/*" multiple><div class="mu">1–3 rasm, har biri 2MB gacha</div><br><button onclick="doAdd()">Joylash</button></div>`},
my:run(async()=>{const r=await api('/items/my');app.innerHTML='<h2>Mening e\'lonlarim</h2><div id="list" class="grid"></div>';draw(r.data,true)}),
claims:run(async()=>{const r=await api('/claims/my');app.innerHTML='<h2>Yuborgan da\'volarim</h2>'+(r.data.map(c=>`<div class="card b">E'lon #${c.item_id} — <b>${c.status}</b></div>`).join('')||'<p class="mu">Yo\'q</p>')}),
admin:()=>{app.innerHTML=`<h2>Admin paneli</h2><p class="mu">Admin istalgan e'lonni o'chira oladi (e'lon sahifasida) va kategoriyalarni boshqaradi.</p>
  <div class="box"><input id="cn" placeholder="Yangi kategoriya"><button onclick="addCat()">Qo'shish</button><hr>
  ${cats.map(c=>`<div class="row" style="align-items:center"><span>${esc(c.name)}</span></div>`).join('')}</div>`}
};
function go(v,a){(views[v]||views.home)(a)}
const imageUrl=image=>{
  if(!image)return '';
  const value=image.filename||image;
  if(/^https?:\/\//i.test(value))return value;
  if(value.startsWith('/'))return value;
  return `/uploads/${encodeURIComponent(value)}`;
};
const img=i=>imageUrl(i.images?.[0]);
async function load(){
  const p=new URLSearchParams({limit:50});
  if($('#q').value)p.set('search',$('#q').value);if($('#ty').value)p.set('type',$('#ty').value);if($('#ct').value)p.set('category_id',$('#ct').value);
  try{draw((await api('/items?'+p)).data)}catch(e){toast(e.message)}}
function draw(L,mine){
  $('#list').innerHTML=L.map(i=>`<div class="card" onclick="show(${i.id})" style="cursor:pointer">${img(i)?`<img src="${img(i)}">`:'<img>'}
  <div class="b"><span class="tag ${i.type}">${i.type==='lost'?'Yo\'qotilgan':'Topilgan'}</span>${mine?` <span class="mu">${i.status}</span>`:''}
  <h4 style="margin:8px 0 4px">${esc(i.title)}</h4><div class="mu">${esc(i.location)}</div>
  ${mine?`<button class="delete-button" type="button" onclick="event.stopPropagation();deleteItem(${i.id})">O'chirish</button>`:''}
  </div></div>`).join('')||'<p class="mu">E\'lon topilmadi</p>'}
const deleteItem=run(async id=>{
  if(!confirm("E'lon va uning rasmlarini o'chirishni tasdiqlaysizmi?"))return;
  await api(`/items/${id}`,{method:'DELETE'});
  toast("E'lon o'chirildi");
  go('my');
});
const show=run(async id=>{
  const i=(await api('/items/'+id)).data;const own=me&&me.id===i.user_id;
  const imgs=(i.images||[]).map(x=>`<img class="detail-image" src="${esc(imageUrl(x))}" alt="${esc(i.title)}" loading="lazy" style="border-radius:8px;margin:4px 0">`).join('');
  let act='';
  if(me&&!own&&i.status==='active'&&i.type==='found'){act=`<h4>Bu meniki</h4><p class="mu">Savol: ${esc(i.secret_question||'')}</p><input id="an" placeholder="Javobingiz"><input id="ms" placeholder="Izoh (ixtiyoriy)"><button onclick="claim(${i.id})">Da'vo yuborish</button>`}
  if(!me)act='<p class="mu">Amal qilish uchun tizimga kiring</p>';
  if(own&&i.type==='found')act+=` <button class="gh" onclick="seeClaims(${i.id})">Da'volar</button><div id="cl"></div>`;
  app.innerHTML=`<div class="box" style="max-width:640px"><button class="gh" onclick="go('home')">← Orqaga</button><h2>${esc(i.title)}</h2>
  <span class="tag ${i.type}">${i.type}</span> <span class="mu">${esc(i.location)} · ${esc(i.event_date||'').slice(0,10)}${i.owner_name?' · '+esc(i.owner_name):''}</span>
  <p>${esc(i.description)}</p>${imgs}<div>${act}${own||me?.role==='admin'?`<button class="delete-button" type="button" onclick="deleteItem(${i.id})">O'chirish</button>`:''}</div></div>`});
const doLogin=run(async()=>{const r=await api('/auth/login',{method:'POST',body:{email:$('#e').value,password:$('#p').value}});
  token=r.data.token||r.token;localStorage.setItem('t',token);me=(await api('/auth/me')).data;nav();go('home')});
const doReg=run(async()=>{const e=$('#e').value;const r=await api('/auth/register',{method:'POST',body:{full_name:$('#n').value,email:e,phone:$('#ph').value,password:$('#p').value}});go('verify',e);if(r.devCode)$('#verify-hint').textContent='Mahalliy tasdiqlash kodi: '+r.devCode;else toast('Kod emailingizga yuborildi')});
const doVerify=run(async()=>{await api('/auth/verify',{method:'POST',body:{email:$('#e').value,code:$('#c').value}});toast('Tasdiqlandi, endi kiring');go('login')});
const resendCode=run(async()=>{const email=$('#e').value.trim();const r=await api('/auth/resend-code',{method:'POST',body:{email}});if(r.devCode)$('#verify-hint').textContent='Mahalliy tasdiqlash kodi: '+r.devCode;else toast('Yangi kod emailingizga yuborildi')});
const doForgot=run(async()=>{const r=await api('/auth/forgot-password',{method:'POST',body:{email:$('#e').value}});if(r.devCode)$('#reset-hint').textContent='Mahalliy parol tiklash kodi: '+r.devCode;else toast('Kod emailingizga yuborildi')});
const doReset=run(async()=>{await api('/auth/reset-password',{method:'POST',body:{email:$('#e').value,code:$('#c').value,newPassword:$('#p').value}});toast('Parol yangilandi');go('login')});
const doAdd=run(async()=>{const f=new FormData(),t=$('#t').value;
  f.append('type',t);f.append('title',$('#ti').value);f.append('description',$('#d').value);f.append('location',$('#l').value);
  f.append('event_date',$('#dt').value);f.append('category_id',$('#c').value);
  if(t==='found'){f.append('secret_question',$('#sq').value);f.append('secret_answer',$('#sa').value)}
  [...$('#im').files].forEach(x=>f.append('images',x));await api('/items',{method:'POST',body:f});toast('E\'lon yaratildi');go('my')});
const claim=run(async id=>{await api(`/claims/items/${id}/claims`,{method:'POST',body:{answer:$('#an').value,message:$('#ms').value}});toast('Da\'vo yuborildi');go('home')});
const seeClaims=run(async id=>{const r=await api(`/items/${id}/claims`);
  $('#cl').innerHTML=r.data.map(c=>`<div class="card b" style="margin-top:8px">${esc(c.claimant_name||c.full_name||'')} — <b>${c.status}</b><div class="mu">${esc(c.message||'')}</div>
  ${c.status==='pending'?`<button class="gr" onclick="dec(${c.id},'approve',${id})">Tasdiqlash</button> <button class="rd" onclick="dec(${c.id},'reject',${id})">Rad etish</button>`:''}</div>`).join('')||'<p class="mu">Da\'vo yo\'q</p>'});
const dec=run(async(cid,a,id)=>{await api(`/claims/${cid}/${a}`,{method:'PATCH'});toast('Bajarildi');seeClaims(id)});
const addCat=run(async()=>{await api('/categories',{method:'POST',body:{name:$('#cn').value}});cats=(await api('/categories')).data;go('admin')});
init();
</script>
</body>
</html>
